name: Validate Personal Work OS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run read-only Worker tests
        run: node --test worker/test/*.test.mjs
      - name: Check inline browser JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = html.split('<script>').slice(1).map((part) => part.split('</script>')[0]);
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script, index) => new vm.Script(script, { filename: `index.html:inline-script-${index + 1}` }));
          for (const required of ['mobile-nav', 'notionConnectForm', 'notionLiveTasks', 'serviceWorker.register']) {
            if (!html.includes(required)) throw new Error(`Required phone app feature missing: ${required}`);
          }
          console.log(`Validated ${scripts.length} inline script(s) and phone app markers.`);
          NODE
      - name: Verify deployed Notion Worker configuration
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://personal-work-os.dendoshakarasu.workers.dev';
          const origin = 'https://personal-work-os-3mr.pages.dev';
          const signal = AbortSignal.timeout(12000);
          const healthResponse = await fetch(`${base}/api/health`, {
            headers: { Origin: origin, Accept: 'application/json' },
            cache: 'no-store',
            signal
          });
          if (!healthResponse.ok) {
            throw new Error(`Worker health endpoint returned HTTP ${healthResponse.status}`);
          }
          const health = await healthResponse.json();
          console.log(`Worker service: ${health.service || 'unknown'}`);
          console.log(`Mode: ${health.mode || 'unknown'}`);
          console.log(`Required runtime configuration: ${health.configured === true ? 'present' : 'missing'}`);
          console.log(`Notion writes enabled: ${health.writesEnabled === true}`);
          if (health.ok !== true || health.mode !== 'read-only' || health.configured !== true) {
            throw new Error('Worker is deployed but reports missing runtime configuration. Check APP_ACCESS_KEY and NOTION_API_KEY under Cloudflare Worker Secrets.');
          }

          const authResponse = await fetch(`${base}/api/tasks?limit=1`, {
            headers: { Origin: origin, Accept: 'application/json' },
            cache: 'no-store',
            signal
          });
          console.log(`Task endpoint without bearer key: HTTP ${authResponse.status} (expected 401)`);
          if (authResponse.status !== 401) {
            throw new Error(`Unexpected task endpoint response: HTTP ${authResponse.status}; expected 401 for an unauthenticated request.`);
          }
          console.log('Live Worker health and read-only authorization gate passed.');
          NODE
