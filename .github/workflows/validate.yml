name: Validate Personal Work OS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run read-only Worker tests
        run: node --test worker/test/*.test.mjs
      - name: Check inline browser JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)];
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: `index.html:inline-script-${index + 1}` }));
          for (const required of ['mobile-nav', 'notionConnectForm', 'notionLiveTasks', 'serviceWorker.register']) {
            if (!html.includes(required)) throw new Error(`Required phone app feature missing: ${required}`);
          }
          console.log(`Validated ${scripts.length} inline script(s) and phone app markers.`);
          NODE
